name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  build:
    name: Build ViPERFX for Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install necessary dependencies
      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
           bc \
           bison \
           build-essential \
           curl \
           flex \
           g++-multilib \
           gcc-multilib \
           git \
           gnupg \
           gperf \
           imagemagick \
           libncurses-dev \
           libncurses-dev:i386 \
           libreadline-dev \
           zlib1g-dev \
           zlib1g:i386 \
           libssl-dev \
           lzop \
           liblz4-tool \
           libxml2 \
           libxml2-utils \
           pngcrush \
           rsync \
           schedtool \
           squashfs-tools \
           xsltproc \
           zip \
           python3 \
           python-is-python3 \
           python3-pip \
           unzip \
           file \
           jq \
           cpio

      # Cache Soong directory to speed up builds
      - name: Cache Soong
        uses: actions/cache@v4
        with:
          path: build/soong
          key: soong-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            soong-${{ runner.os }}-

      # Cache NDK to avoid downloading it multiple times
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: prebuilts/ndk
          key: ndk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ndk-${{ runner.os }}-

      # Initialize NDK if not present
      - name: Initialize NDK
        run: |
          if [ ! -d "prebuilts/ndk" ]; then
            echo "NDK directory not found, cloning it..."
            mkdir -p prebuilts
            git clone https://android.googlesource.com/platform/ndk.git prebuilts/ndk
          else
            echo "NDK directory exists."
          fi

      # Initialize Soong build system (clone if missing)
      - name: Initialize Soong
        run: |
          if [ ! -d "build/soong" ]; then
            echo "Soong directory not found, cloning it..."
            git clone https://android.googlesource.com/platform/build/soong.git build/soong
          fi
          rm -rf .soong.bootstrap out/soong/.bootstrap  # Ensure a clean environment
          build/soong/soong_ui.bash --make-mode --blueprint Android.bp  # Initialize Soong build system

      # Cache Soong output to avoid rebuilding everything
      - name: Cache Soong Output
        uses: actions/cache@v4
        with:
          path: out/
          key: out-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            out-${{ runner.os }}-

      # Build Libraries for each ABI in the matrix
      - name: Build Libraries
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic \
            prebuilts/build-tools/linux-x86/bin/soong_build \
            --soong-out out/soong \
            --out out \
            --blueprint Android.bp

            # Copy the output files for each ABI
            cp out/$abi/libv4a_re.so libv4a_re_$abi.so
            cp out/$abi/libv4aidl_re.so libv4aidl_re_$abi.so
          done

      # Upload the built libraries as artifacts
      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the built libraries
      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      # Prepare the Magisk Module
      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/
            cp build_output/libv4aidl_re_$abi.so module/common/files/
          done

      # Zip the Magisk module
      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      # Upload the zipped Magisk module as an artifact
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v3
        with:
          name: V4A_Magisk_Module
          path: module
