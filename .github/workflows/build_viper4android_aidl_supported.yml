name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  build:
    name: Build ViPERFX for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK and Soong
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          local-cache: true

      - name: Configure Soong Environment
        run: |
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export TARGET_ARCH_ABI="armeabi-v7a arm64-v8a x86 x86_64"
          source build/envsetup.sh

      - name: Build Libraries
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic USE_SOONG=true mmma -j$(nproc) .
            cp out/$abi/system/lib/soundfx/libv4a_re.so libv4a_re_$abi.so
            cp out/$abi/system/lib/soundfx/libv4aidl_re.so libv4aidl_re_$abi.so
          done

      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        for: [armeabi-v7a, arm64-v8a, x86, x86_64]
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/libv4a_re.so
            cp build_output/libv4aidl_re_$abi.so module/common/files/libv4aidl_re.so
          done

      # Zip the Magisk module
      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      # Upload the zipped Magisk module as an artifact
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v3
        with:
          name: V4A_Magisk_Module
          path: module

