name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  setup-dependencies:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick libncurses-dev libreadline-dev \
            zlib1g-dev libssl-dev lzop liblz4-tool libxml2 libxml2-utils \
            pngcrush rsync schedtool squashfs-tools xsltproc zip python3 python-is-python3 \
            python3-pip unzip file jq cpio golang-go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

  setup-soong:
    name: Setup Soong
    needs: setup-dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'

      - name: Clone repositories
        run: |
          mkdir -p android-build/external
          cd android-build
          
          # Clone main repos
          git clone --depth=1 https://android.googlesource.com/platform/build/blueprint
          git clone --depth=1 https://android.googlesource.com/platform/build/soong
          
          # Clone external dependencies with specific tags/versions
          cd external
          git clone --depth=1 https://github.com/google/go-cmp go-cmp
          mkdir -p google.golang.org
          cd google.golang.org
          git clone --depth=1 --branch=v1.31.0 https://github.com/protocolbuffers/protobuf-go protobuf
          cd ..
          git clone --depth=1 --branch=v1.5.3 https://github.com/golang/protobuf github.com/golang/protobuf
          git clone --depth=1 https://github.com/google/starlark-go starlark-go
          cd ..

      - name: Setup Go workspace
        run: |
          cd android-build
          echo 'go 1.23.6' > go.work
          echo '' >> go.work
          echo 'use (' >> go.work
          echo '        ./blueprint' >> go.work
          echo '        ./soong' >> go.work
          echo '        ./external/go-cmp' >> go.work
          echo '        ./external/google.golang.org/protobuf' >> go.work
          echo '        ./external/github.com/golang/protobuf' >> go.work
          echo '        ./external/starlark-go' >> go.work
          echo ')' >> go.work
          
          # Setup protobuf environment
          mkdir -p external/google.golang.org/protobuf/android
          cat > external/google.golang.org/protobuf/android/android.go << 'EOL'
package android

// Placeholder package for Android-specific protobuf functionality
EOL

      - name: Build Blueprint and Soong
        run: |
          cd android-build
          export GOPATH=$HOME/go
          export PATH=$PATH:$GOPATH/bin
          
          # Initialize and build Blueprint
          cd blueprint
          rm -f go.mod go.sum
          go mod init github.com/google/blueprint
          go mod edit -replace github.com/google/blueprint=./
          go mod tidy
          go build -o blueprint
          chmod +x blueprint
          cd ..
          
          # Initialize and build Soong
          cd soong
          rm -f go.mod go.sum
          go mod init android/soong
          
          # Add required dependencies
          go mod edit -replace github.com/google/blueprint=../blueprint
          go mod edit -replace google.golang.org/protobuf=../external/google.golang.org/protobuf
          go mod edit -replace github.com/golang/protobuf=../external/github.com/golang/protobuf
          go mod edit -replace go.starlark.net=../external/starlark-go
          go mod edit -replace github.com/google/go-cmp=../external/go-cmp
          
          # Fix dependencies versions
          go get -d google.golang.org/protobuf@v1.31.0
          go get -d github.com/golang/protobuf@v1.5.3
          go get -d go.starlark.net@latest
          go get -d github.com/google/go-cmp@latest
          
          go mod tidy
          go build -o soong_build ./cmd/soong
          chmod +x soong_build
          cd ..
          
          # Create symbolic links
          mkdir -p out
          ln -sf $(pwd)/blueprint/blueprint out/
          ln -sf $(pwd)/soong/soong_build out/
          
          # Verify builds
          ls -la blueprint/blueprint soong/soong_build

      - name: Cache Soong build
        uses: actions/cache@v4
        with:
          path: android-build
          key: soong-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            soong-build-${{ runner.os }}-

  build:
    name: Build ViPERFX for Android
    needs: setup-soong
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Soong build
        uses: actions/cache@v4
        with:
          path: android-build
          key: soong-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            soong-build-${{ runner.os }}-

      # Build Libraries
      - name: Build Libraries
        run: |
          cd android-build
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic \
              ./soong/soong_build \
              --soong-out out/soong \
              --out out \
              --blueprint ../Android.bp

            # Copy the output files for each ABI
            cp out/$abi/libv4a_re.so ../libv4a_re_$abi.so
            cp out/$abi/libv4aidl_re.so ../libv4aidl_re_$abi.so
          done

      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/
            cp build_output/libv4aidl_re_$abi.so module/common/files/
          done

      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v3
        with:
          name: V4A_Magisk_Module
          path: module
