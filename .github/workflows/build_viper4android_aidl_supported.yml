name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  build:
    name: Build ViPERFX for Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install necessary dependencies
      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick libncurses-dev libreadline-dev \
            zlib1g-dev libssl-dev lzop liblz4-tool libxml2 libxml2-utils \
            pngcrush rsync schedtool squashfs-tools xsltproc zip python3 python-is-python3 \
            python3-pip unzip file jq cpio golang-go

      # Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Cache Go modules
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Set up Soong build environment
      - name: Set up Soong environment
        run: |
          # Create build directory structure
          mkdir -p android-build/external
          cd android-build
          
          # Clone all necessary repositories
          git clone --depth=1 https://android.googlesource.com/platform/build/blueprint
          git clone --depth=1 https://android.googlesource.com/platform/build/soong
          
          # Clone external dependencies
          cd external
          git clone --depth=1 https://github.com/google/go-cmp go-cmp
          git clone --depth=1 https://github.com/golang/protobuf golang-protobuf
          git clone --depth=1 https://github.com/google/starlark-go starlark-go
          cd ..
          
          # Set up build environment
          export GOPATH=$HOME/go
          export PATH=$PATH:$GOPATH/bin
          
          # Remove existing go.work files if they exist
          find . -name "go.work" -type f -delete
          
          # Create new go.work file
          echo 'go 1.21' > go.work
          echo '' >> go.work
          echo 'use (' >> go.work
          echo '        ./blueprint' >> go.work
          echo '        ./soong' >> go.work
          echo '        ./external/go-cmp' >> go.work
          echo '        ./external/golang-protobuf' >> go.work
          echo '        ./external/starlark-go' >> go.work
          echo ')' >> go.work
          
          # Build Blueprint
          cd blueprint
          go mod tidy
          go build -o blueprint
          chmod +x blueprint
          cd ..
          
          # Build Soong
          cd soong
          go mod tidy
          go build -o soong_build ./cmd/soong
          chmod +x soong_build
          cd ..
          
          # Create symbolic links
          mkdir -p out
          ln -sf $(pwd)/blueprint/blueprint out/
          ln -sf $(pwd)/soong/soong_build out/

      # Cache the build output
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: android-build/out
          key: build-output-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-output-${{ runner.os }}-

      # Build Libraries
      - name: Build Libraries
        run: |
          cd android-build
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic \
              ./soong/soong_build \
              --soong-out out/soong \
              --out out \
              --blueprint ../Android.bp

            # Copy the output files for each ABI
            cp out/$abi/libv4a_re.so ../libv4a_re_$abi.so
            cp out/$abi/libv4aidl_re.so ../libv4aidl_re_$abi.so
          done

      # Upload the built libraries as artifacts
      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the built libraries
      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      # Prepare the Magisk Module
      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/
            cp build_output/libv4aidl_re_$abi.so module/common/files/
          done

      # Zip the Magisk module
      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      # Upload the zipped Magisk module as an artifact
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v3
        with:
          name: V4A_Magisk_Module
          path: module
