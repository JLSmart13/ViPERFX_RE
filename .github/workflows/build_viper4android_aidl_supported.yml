name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  build:
    name: Build ViPERFX for Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick libncurses-dev libncurses-dev:i386 \
            libreadline-dev zlib1g-dev zlib1g:i386 libssl-dev lzop \
            liblz4-tool libxml2 libxml2-utils pngcrush rsync schedtool \
            squashfs-tools xsltproc zip python3 python-is-python3 \
            python3-pip unzip file jq cpio

      # Restore Soong cache
      - name: Restore Soong Cache
        uses: actions/cache@v4
        with:
          path: out/soong
          key: soong-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            soong-${{ runner.os }}-

      # Initialize Soong
      - name: Initialize Soong
        run: |
          rm -rf .soong.bootstrap out/soong/.bootstrap  # Clean bootstrap
          build/soong/soong_ui.bash --make-mode --blueprint Android.bp

      # Build libraries for each ABI
      - name: Build Libraries
        run: |
          for abi in ${{ matrix.abi }}; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic \
            build/soong/soong_ui.bash --make-mode v4a

            # Copy the outputs for each ABI, renaming appropriately
            cp out/$abi/libv4a_re.so libv4a_re_$abi.so
            cp out/$abi/libv4aidl_re.so libv4aidl_re_$abi.so
          done

      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/
            cp build_output/libv4aidl_re_$abi.so module/common/files/
          done

      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      - name: Upload Magisk Module
        uses: actions/upload-artifact@v4
        with:
          name: V4A_Magisk_Module
          path: magisk_module.zip
