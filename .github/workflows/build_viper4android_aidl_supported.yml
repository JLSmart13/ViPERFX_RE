name: Build ViPER4Android

on:
  push:
    branches:
      - foss
  pull_request:
    branches:
      - foss

jobs:
  build:
    name: Build ViPERFX for Android
    runs-on: ubuntu-latest

    strategy:
      matrix:
        abi: ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install necessary dependencies
      - name: Set up dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg \
            gperf imagemagick libncurses-dev libncurses-dev:i386 libreadline-dev \
            zlib1g-dev zlib1g:i386 libssl-dev lzop liblz4-tool libxml2 libxml2-utils \
            pngcrush rsync schedtool squashfs-tools xsltproc zip python3 python-is-python3 \
            python3-pip unzip file jq cpio

      # Cache NDK to avoid re-downloading it
      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: prebuilts/ndk
          key: ndk-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ndk-${{ runner.os }}-

      # Initialize NDK if not present
      - name: Initialize NDK
        run: |
          if [ ! -d "prebuilts/ndk" ]; then
            echo "NDK directory not found, cloning it..."
            mkdir -p prebuilts
            git clone https://android.googlesource.com/platform/ndk.git prebuilts/ndk
          else
            echo "NDK directory exists."
          fi

      # Restore cached built Soong binary (from Option 1)
      - name: Restore Cached Soong Build Binary
        id: cache_soong
        uses: actions/cache@v4
        with:
          path: soong/soong_build
          key: soong-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            soong-build-${{ runner.os }}-

      # Build Soong and Blueprint (Option 1)
      - name: Build Soong (Option 1)
        run: |
          if [ ! -f soong/soong_build ]; then
            echo "soong_build binary not found, building Soong and Blueprint..."
            if [ ! -d blueprint ]; then
              git clone --depth=1 https://android.googlesource.com/platform/build/blueprint
            else
              echo "Blueprint directory exists."
            fi
            if [ ! -d soong ]; then
              git clone --depth=1 https://android.googlesource.com/platform/build/soong
            else
              echo "Soong directory exists."
            fi
            echo "Building Blueprint..."
            cd blueprint
            # Remove the go.work file to avoid external module lookup issues
            [ -f go.work ] && rm go.work
            go build .
            cd ../soong
            echo "Building Soong..."
            [ -f go.work ] && rm go.work
            go build -o soong_build .
          else
            echo "Using cached soong_build binary."
          fi

      # Cache the Soong output to avoid rebuilding everything
      - name: Cache Soong Output
        uses: actions/cache@v4
        with:
          path: out/
          key: out-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            out-${{ runner.os }}-

      # Build Libraries for each ABI using the built Soong binary
      - name: Build Libraries
        run: |
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p out/$abi
            OUT_DIR=out/$abi TARGET_ARCH=$abi TARGET_ARCH_VARIANT=generic \
              ./soong/soong_build \
              --soong-out out/soong \
              --out out \
              --blueprint Android.bp

            # Copy the output files for each ABI
            cp out/$abi/libv4a_re.so libv4a_re_$abi.so
            cp out/$abi/libv4aidl_re.so libv4aidl_re_$abi.so
          done

      # Upload the built libraries as artifacts
      - name: Upload built libraries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4a-libraries
          path: |
            libv4a_re_*.so
            libv4aidl_re_*.so

  package:
    name: Package Magisk Module
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the built libraries
      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: v4a-libraries
          path: build_output

      # Prepare the Magisk Module
      - name: Prepare Magisk Module
        run: |
          mkdir -p module/common/files
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            cp build_output/libv4a_re_$abi.so module/common/files/
            cp build_output/libv4aidl_re_$abi.so module/common/files/
          done

      # Zip the Magisk module
      - name: Zip Magisk Module
        run: |
          cd module
          zip -r ../magisk_module.zip ./

      # Upload the zipped Magisk module as an artifact
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v3
        with:
          name: V4A_Magisk_Module
          path: module
